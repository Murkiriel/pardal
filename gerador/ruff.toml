# Configuração mínima: erros de sintaxe/nomes (E4, E7, E9, F) e bugbear (B).
#   python -m ruff check datakit scripts run.py
target-version = "py312"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "B"]
# zip(..., strict=True) mudaria o comportamento: vários zips são de propósito de tamanhos
# diferentes (zip(pts, pts[1:])).
ignore = ["B905"]
