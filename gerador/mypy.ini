# Configuração mínima.   python -m mypy datakit scripts
[mypy]
python_version = 3.12
# shapely, openpyxl, pyshp e pypdf não trazem tipos (ou trazem parciais)
ignore_missing_imports = True

[mypy-datakit.sources.osm_pbf,datakit.sources.sc_portable_radar]
# O pyosmium entrega cada objeto do .pbf como uma união (Node | Way | Relation | ...); o código
# separa com o.is_node() / o.is_way() / o.is_relation(), que o mypy não consegue acompanhar.
disable_error_code = union-attr
