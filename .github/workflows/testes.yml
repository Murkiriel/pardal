name: Testes

# Testes, estilo e tipos do gerador a cada push no main e em cada pull request que mexa no código.
# Sem isto, um erro só aparecia no dia da geração dos dados (o workflow "Gerar dados" roda os
# testes, mas só quando gera). Os commits de dados (brasil/, estados/, catalogo.json) não
# disparam nada aqui.

on:
  push:
    branches: [main]
    paths:
      - "gerador/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "gerador/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gerador
    steps:
      - name: Código
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gerador/requirements*.txt

      - name: Dependências
        run: pip install -q -r requirements-dev.txt

      - name: Testes do gerador
        run: python -m unittest discover -s datakit/tests -t .

      - name: Estilo (ruff)
        run: python -m ruff check datakit scripts run.py

      - name: Tipos (mypy)
        run: python -m mypy datakit scripts
